name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch breaking changes in NeoGP.jl, which is installed from its main branch.
    - cron: '0 4 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}  # a login shell activates the micromamba environment
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # Julia 1.13 (required by NeoGP.jl) needs a Python linked with OpenSSL 3.5 or newer
      # (juliapkg refuses Julia >= 1.12 otherwise).  The Pythons of actions/setup-python
      # use an older OpenSSL; the ones of conda-forge a current one.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test
          create-args: >-
            -c conda-forge
            python=${{ matrix.python-version }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: python -c "import ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION)"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
